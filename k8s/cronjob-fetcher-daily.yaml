apiVersion: batch/v1
kind: CronJob
metadata:
  name: guild-tracker-fetcher-daily
  namespace: guild-tracker
spec:
  schedule: "0 0 * * *" # midnight
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: fetcher
              image: ghcr.io/itslukv/guild-tracker:latest
              command: ["/app/fetcher", "--mode", "daily"]
              envFrom:
                - secretRef:
                    name: guild-tracker-env
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 256Mi
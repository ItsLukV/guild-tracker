apiVersion: apps/v1
kind: Deployment
metadata:
  name: guild-tracker-website
  namespace: guild-tracker
  labels:
    app: guild-tracker-website
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: guild-tracker-website
  template:
    metadata:
      labels:
        app: guild-tracker-website
    spec:
      imagePullSecrets:
        - name: ghcr-pull # drop this if you make the ghcr.io package public
      containers:
        - name: website
          image: ghcr.io/itslukv/guild-tracker:latest
          command: ["/app/website"]
          envFrom:
            - secretRef:
                name: guild-tracker-env
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

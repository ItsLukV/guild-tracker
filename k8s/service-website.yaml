# Reachable at http://<pi5-tailscale-ip>:30880 from any device on your tailnet
# (no extra cluster components needed).
apiVersion: v1
kind: Service
metadata:
  name: guild-tracker-website
  namespace: guild-tracker
spec:
  type: NodePort
  selector:
    app: guild-tracker-website
  ports:
    - port: 80
      targetPort: http
      nodePort: 30880
      name: http

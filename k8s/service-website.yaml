# Requires the Tailscale Kubernetes operator to be installed on the cluster:
# https://tailscale.com/kb/1236/kubernetes-operator
# Once running, this shows up on your tailnet as "guild-tracker-website".
apiVersion: v1
kind: Service
metadata:
  name: guild-tracker-website
  namespace: guild-tracker
  annotations:
    tailscale.com/hostname: guild-tracker-website
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: guild-tracker-website
  ports:
    - port: 80
      targetPort: http
      name: http
